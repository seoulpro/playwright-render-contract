<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Delayed fixture</title></head>
  <body>
    <main>
      <h1>Delayed page</h1>
    </main>
    <script>
      setTimeout(() => {
        const marker = document.createElement("div");
        marker.dataset.ready = "true";
        marker.textContent = "Ready";
        document.querySelector("main").append(marker);
      }, 30);
    </script>
  </body>
</html>
